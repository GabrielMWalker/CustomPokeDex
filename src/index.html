<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Cobbleverse Companion</title>
  <link rel="stylesheet" href="./styles/cobbleverse.css">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="brand">
        <span class="brand-orb" aria-hidden="true"></span>
        <div>
          <p class="eyebrow">Cobbleverse 1.7.31</p>
          <h1>Companion</h1>
        </div>
      </div>

      <nav class="main-nav" id="main-nav">
        <button class="nav-button is-active" data-view="pokedex" type="button"><span>Pokédex</span><b id="nav-pokedex-count">1025</b></button>
        <button class="nav-button" data-view="drops" type="button"><span>Drops</span><b id="nav-drops-count">0</b></button>
        <button class="nav-button" data-view="baits" type="button"><span>Baits</span><b id="nav-baits-count">78</b></button>
        <button class="nav-button" data-view="berries" type="button"><span>Berries</span><b id="nav-berries-count">70</b></button>
        <button class="nav-button" data-view="breeding" type="button"><span>Breeding</span><b>Compat.</b></button>
        <button class="nav-button" data-view="teams" type="button"><span>Times</span><b id="nav-teams-count">0</b></button>
        <button class="nav-button" data-view="counters" type="button"><span>Counters</span><b>Tipos</b></button>
        <button class="nav-button" data-view="gyms" type="button"><span>Ginásios</span><b id="nav-gyms-count">0/32</b></button>
        <button class="nav-button" data-view="settings" type="button"><span>Configurações</span><b>v2</b></button>
      </nav>

      <footer class="sidebar-footer">
        <button class="preference-button" id="theme-toggle" type="button">Alternar tema</button>
        <p>Dados exatos da instalação local<br><strong>COBBLEVERSE 1.7.31-CF</strong></p>
      </footer>
    </aside>

    <section class="workspace">
      <header class="workspace-header">
        <div>
          <p class="eyebrow" id="view-kicker">Guia do modpack</p>
          <h2 id="view-title">Pokédex Cobbleverse</h2>
          <p class="view-description" id="view-description">Espécies, spawns e evoluções da versão instalada.</p>
        </div>
        <div class="header-meta" id="header-meta"></div>
      </header>

      <section class="content" id="content" aria-live="polite"></section>
    </section>
  </main>

  <div class="modal" id="pokemon-modal" hidden>
    <button class="modal-backdrop" data-close-modal type="button" aria-label="Fechar detalhes"></button>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" data-close-modal type="button" aria-label="Fechar">×</button>
      <div id="modal-content"></div>
    </section>
  </div>

  <input id="backup-file-input" type="file" accept="application/json,.json" hidden>
  <datalist id="pokemon-options"></datalist>
  <datalist id="bait-options"></datalist>
  <datalist id="drop-options"></datalist>

  <script src="./cobbleverse-data.js"></script>
  <script src="./scripts/cobbleverse-app.js"></script>
</body>
</html>

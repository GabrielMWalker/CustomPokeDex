name: Release Desktop

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-windows:
    name: Windows NSIS
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        shell: pwsh
        run: |
          $config = Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($config.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "A tag '$env:GITHUB_REF_NAME' nao bate com a versao do Tauri '$expectedTag'."
          }

      - name: Restore Tauri signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_B64) {
            throw "Secret TAURI_SIGNING_PRIVATE_KEY_B64 nao configurada."
          }
          New-Item -ItemType Directory -Force .tauri | Out-Null
          $key = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:TAURI_SIGNING_PRIVATE_KEY_B64))
          [IO.File]::WriteAllText((Join-Path (Resolve-Path .tauri) "pixelmon-pokelist.key"), $key, [Text.UTF8Encoding]::new($false))

      - name: Validate JavaScript
        run: |
          node --check src\scripts\cobbleverse-app.js
          node scripts\verify-cobbleverse-data.mjs
          node --check scripts\generate-latest-json.mjs
          node --check scripts\release-notes.mjs

      - name: Build NSIS installer
        run: npm.cmd run build -- --bundles nsis

      - name: Generate latest.json and signature
        run: npm.cmd run release:latest-json

      - name: Generate release notes
        run: node scripts\release-notes.mjs $env:GITHUB_REF_NAME > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/nsis/Cobbleverse Companion_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/Cobbleverse Companion_*_x64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json

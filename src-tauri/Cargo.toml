[package]
name = "pixelmon-pokelist"
version = "1.0.2"
description = "Pokelist local para Pixelmon"
authors = ["GabrielMWalker"]
edition = "2021"

[lib]
name = "pixelmon_pokedex_checklist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"

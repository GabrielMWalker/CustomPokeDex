[package]
name = "cobbleverse-companion"
version = "2.0.0"
description = "Companion local para Cobbleverse"
authors = ["GabrielMWalker"]
edition = "2021"

[lib]
name = "cobbleverse_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
